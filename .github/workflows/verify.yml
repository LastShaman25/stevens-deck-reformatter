name: Verify Slide Studio
on: [push, pull_request]
jobs:
  verification:
    runs-on: windows-latest
    env:
      STEVENS_OFFLINE: '1'
      STEVENS_LEARN: '0'
      CI: 'true'
      STEVENS_SOFFICE: 'C:\Program Files\LibreOffice\program\soffice.com'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install renderer
        run: |
          choco install libreoffice-fresh --version=26.2.6 --no-progress -y
          if ($LASTEXITCODE -notin @(0,3010)) { throw 'LibreOffice installation failed' }
          if (-not (Test-Path -LiteralPath $env:STEVENS_SOFFICE)) { throw 'LibreOffice console executable missing' }
      - name: Install Python dependencies
        run: python -m pip install -r backend/requirements-lock.txt
      - name: Frontend tests and build
        working-directory: frontend
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { throw 'Dependency installation failed' }
          npx vitest run
          if ($LASTEXITCODE -ne 0) { throw 'Frontend tests failed' }
          npm run build
          if ($LASTEXITCODE -ne 0) { throw 'Frontend build failed' }
      # Backend HTTP checks serve this build; a clean checkout has no frontend/dist.
      - name: Backend and required render tests
        run: |
          New-Item -ItemType Directory .local/verification -Force | Out-Null
          python -m pytest -q --basetemp=.local/verification/pytest-ci --junitxml=.local/verification/backend-tests.xml
          if ($LASTEXITCODE -ne 0) { throw 'Backend or required render tests failed' }
      - name: Generate synthetic browser fixture
        run: python tools/create_test_fixture.py
      - name: Install test browser
        working-directory: frontend
        run: npx playwright install chromium
      - name: Browser workflows
        shell: pwsh
        run: |
          $server = Start-Process -FilePath python -ArgumentList '-m','uvicorn','app.main:app','--app-dir','backend','--host','127.0.0.1','--port','8000' -WindowStyle Hidden -PassThru
          try {
            for ($attempt=0; $attempt -lt 30; $attempt++) {
              try { Invoke-WebRequest http://127.0.0.1:8000/api/health | Out-Null; break } catch { Start-Sleep -Seconds 1 }
            }
            npm --prefix frontend run test:e2e
            if ($LASTEXITCODE -ne 0) { throw 'Browser verification failed' }
          } finally { Stop-Process -Id $server.Id -ErrorAction SilentlyContinue }
      # Only synthetic test summaries; private course decks/renders are never uploaded.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-results
          path: |
            .local/verification/backend-tests.xml
            frontend/test-results/browser-results.json
